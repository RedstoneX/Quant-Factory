name: ${QF_ONECLI_PROJECT:?production project name required}

x-hardened-service: &hardened-service
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

services:
  postgres:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: onecli
      POSTGRES_PASSWORD: ${QF_ONECLI_POSTGRES_PASSWORD:?external secrets file required}
      POSTGRES_DB: onecli
    volumes:
      - {type: volume, source: postgres-data, target: /var/lib/postgresql}
    networks: [control]
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onecli -d onecli"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  migrations:
    image: ghcr.io/onecli/onecli-migrations@sha256:8293f29e22024a789c987593a512b18140056bf6a522324616c1b48699ac2fa8
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://onecli:${QF_ONECLI_POSTGRES_PASSWORD:?external secrets file required}@postgres:5432/onecli
    networks: [control]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 96
    <<: *hardened-service

  api:
    image: ghcr.io/onecli/onecli-api@sha256:48f9b66cda3a136428cf530d4cb934d1ce6bf3a186dd592f02ea3b40a48e2e44
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgresql://onecli:${QF_ONECLI_POSTGRES_PASSWORD:?external secrets file required}@postgres:5432/onecli
      BETTER_AUTH_SECRET: ${QF_ONECLI_BETTER_AUTH_SECRET:?external secrets file required}
      SECRET_ENCRYPTION_KEY: ${QF_ONECLI_SECRET_ENCRYPTION_KEY:?external secrets file required}
      GATEWAY_INTERNAL_SECRET: ${QF_ONECLI_GATEWAY_INTERNAL_SECRET:?external secrets file required}
      GATEWAY_INTERNAL_URL: http://gateway:10255
      ONECLI_AGENT_PROXY_ADDRESS: gateway-relay:10255
      ONECLI_APP_PORT: "10254"
      ONECLI_API_PORT: "10256"
      ONECLI_GATEWAY_PORT: "10255"
    volumes:
      - {type: volume, source: app-data, target: /app/data, read_only: true}
    networks: [control]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 192
    <<: *hardened-service

  web:
    image: ghcr.io/onecli/onecli-web@sha256:123907a95915db1f645be11bf54709f2aa81c44706f263fdd7cef9141ed73118
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://onecli:${QF_ONECLI_POSTGRES_PASSWORD:?external secrets file required}@postgres:5432/onecli
      BETTER_AUTH_SECRET: ${QF_ONECLI_BETTER_AUTH_SECRET:?external secrets file required}
      SECRET_ENCRYPTION_KEY: ${QF_ONECLI_SECRET_ENCRYPTION_KEY:?external secrets file required}
    networks: [control]
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    <<: *hardened-service

  gateway:
    image: ghcr.io/onecli/onecli-gateway@sha256:e2bb74a919a34ec8e268168930a0ad38b7adbdbe4a2766afc08eeca1f083354f
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://onecli:${QF_ONECLI_POSTGRES_PASSWORD:?external secrets file required}@postgres:5432/onecli
      BETTER_AUTH_SECRET: ${QF_ONECLI_BETTER_AUTH_SECRET:?external secrets file required}
      SECRET_ENCRYPTION_KEY: ${QF_ONECLI_SECRET_ENCRYPTION_KEY:?external secrets file required}
      GATEWAY_INTERNAL_SECRET: ${QF_ONECLI_GATEWAY_INTERNAL_SECRET:?external secrets file required}
      INTERNAL_API_URL: http://api:10256
    volumes:
      - {type: volume, source: app-data, target: /app/data}
    networks:
      control:
        interface_name: eth0
        priority: 1000
      actor:
        aliases: [gateway-relay]
        interface_name: eth1
        priority: 500
      egress:
        interface_name: eth2
        priority: 100
        gw_priority: 1
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    <<: *hardened-service

networks:
  control:
    internal: true
  actor:
    external: true
    name: ${QF_ONECLI_ACTOR_NETWORK:?external actor network required}
  egress: {}

volumes:
  postgres-data:
    external: true
    name: ${QF_ONECLI_POSTGRES_VOLUME:?external PostgreSQL volume required}
  app-data:
    external: true
    name: ${QF_ONECLI_APP_VOLUME:?external application volume required}
