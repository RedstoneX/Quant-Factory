name: ${ONECLI_V2_PROJECT:?set a unique isolated project name}

# Official OneCLI v2.4.0 topology, reduced to its required services.  The
# runner, SSH terminator, and channel adapter are intentionally absent: this
# rehearsal has no hosted agents, Docker socket, or public ingress.
services:
  postgres:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: "no"
    environment:
      POSTGRES_USER: onecli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?runtime environment is required}
      POSTGRES_DB: onecli
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [control]
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onecli -d onecli"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  migrations:
    image: ghcr.io/onecli/onecli-migrations@sha256:8293f29e22024a789c987593a512b18140056bf6a522324616c1b48699ac2fa8
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment: &application_environment
      DATABASE_URL: postgresql://onecli:${POSTGRES_PASSWORD:?runtime environment is required}@postgres:5432/onecli
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?runtime environment is required}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?runtime environment is required}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?runtime environment is required}
      # The isolated browser origin is resolvable only from the control network.
      # These explicit per-origin routes are required because http external URLs
      # otherwise derive same-host ports, while api and gateway are separate
      # services in this no-host-port rehearsal.
      ONECLI_EXTERNAL_URL: http://web:10254
      API_URL: http://api:10256
      GATEWAY_API_URL: http://gateway:10255
      ONECLI_TRUSTED_ORIGINS: http://web:10254
    networks: [control]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 96
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    image: ghcr.io/onecli/onecli-api@sha256:48f9b66cda3a136428cf530d4cb934d1ce6bf3a186dd592f02ea3b40a48e2e44
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    environment:
      <<: *application_environment
      GATEWAY_INTERNAL_URL: http://gateway:10255
      ONECLI_AGENT_PROXY_ADDRESS: gateway:10255
      ONECLI_APP_PORT: 10254
      ONECLI_API_PORT: 10256
      ONECLI_GATEWAY_PORT: 10255
    volumes:
      - app-data:/app/data:ro
    networks: [control]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 192
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    image: ghcr.io/onecli/onecli-web@sha256:123907a95915db1f645be11bf54709f2aa81c44706f263fdd7cef9141ed73118
    restart: "no"
    depends_on:
      api: {condition: service_healthy}
    environment:
      <<: *application_environment
      GATEWAY_INTERNAL_URL: http://gateway:10255
      ONECLI_APP_PORT: 10254
      ONECLI_API_PORT: 10256
      ONECLI_GATEWAY_PORT: 10255
    networks: [control]
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    image: ghcr.io/onecli/onecli-gateway@sha256:e2bb74a919a34ec8e268168930a0ad38b7adbdbe4a2766afc08eeca1f083354f
    restart: "no"
    depends_on:
      api: {condition: service_healthy}
    environment:
      <<: *application_environment
      INTERNAL_API_URL: http://api:10256
      ONECLI_APP_PORT: 10254
    volumes:
      - app-data:/app/data
    networks: [control, actor]
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  control:
    internal: true
  actor:
    internal: true

volumes:
  postgres-data:
  app-data:
