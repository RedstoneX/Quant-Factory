name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test documentation validator
        run: python -m unittest tests.test_documentation_governance -v
      - name: Check current documentation and retained incident history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            python tools/check_documentation.py
          else
            python tools/check_documentation.py --base-ref "$BASE_REF"
          fi

  portable-tests:
    name: Portable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-ci.txt
            requirements-dashboard.txt
      - name: Enforce architecture dependency boundaries
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_architecture.py --base-ref "$BASE_REF"
      - name: Install public test dependencies
        run: >-
          python -m pip install
          --constraint requirements-runtime.txt
          --requirement requirements-runtime.txt
          --requirement requirements-ci.txt
          --requirement requirements-dashboard.txt
      - name: Run complete non-browser test suite
        run: >-
          python -m pytest -q
          --junitxml=non-browser-test-results.xml
          --ignore=tests/browser
          tests
      - name: Verify non-browser test report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("non-browser-test-results.xml")
          if not report.is_file():
              raise SystemExit("Non-browser test report is missing.")
          root = ElementTree.parse(report).getroot()
          cases = list(root.iter("testcase"))
          failures = sum(bool(case.findall("failure")) for case in cases)
          errors = sum(bool(case.findall("error")) for case in cases)
          skipped_cases = {
              (case.get("classname", ""), case.get("name", ""))
              for case in cases
              if case.findall("skipped")
          }
          expected_skips = {
              (
                  "tests.test_prefect_spike",
                  "test_live_external_prefect_retry_success_path",
              ),
              (
                  "tests.test_prefect_spike",
                  "test_live_external_prefect_timeout_path",
              ),
          }
          print(
              f"Non-browser suite: {len(cases)} collected; "
              f"{len(skipped_cases)} skipped; "
              f"{failures} failed; {errors} errors."
          )
          if not cases or failures or errors:
              raise SystemExit("Non-browser test report is incomplete or not green.")
          if skipped_cases != expected_skips:
              raise SystemExit(
                  "Non-browser skips differ from the two declared external-Prefect tests: "
                  f"{sorted(skipped_cases)}"
              )
          PY
      # actions/upload-artifact v7.0.1
      - name: Upload non-browser test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: non-browser-test-results
          path: non-browser-test-results.xml
          if-no-files-found: error
          retention-days: 30

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-ci.txt
            requirements-dashboard.txt
      - name: Install public test dependencies
        run: >-
          python -m pip install
          --constraint requirements-runtime.txt
          --requirement requirements-runtime.txt
          --requirement requirements-ci.txt
          --requirement requirements-dashboard.txt
          playwright==1.63.0
      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run complete browser test suite
        run: >-
          python -m pytest -q
          --junitxml=browser-test-results.xml
          tests/browser
      - name: Verify browser test report
        if: always()
        run: python tools/assert_junit_report.py browser-test-results.xml
      # actions/upload-artifact v7.0.1
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-test-results
          path: browser-test-results.xml
          if-no-files-found: error
          retention-days: 30
