name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test documentation validator
        run: python -m unittest tests.test_documentation_governance -v
      - name: Check current documentation and retained incident history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            python tools/check_documentation.py
          else
            python tools/check_documentation.py --base-ref "$BASE_REF"
          fi

  portable-tests:
    name: Portable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install public test dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run portable test selection
        run: >-
          python -m pytest -q
          --junitxml=portable-test-results.xml
          tests/test_ci_portable_imports.py
          tests/test_results_model.py
          tests/test_research_launch_claims.py
          tests/test_run_stale_recovery.py
          tests/test_execution_contracts.py
          tests/test_paper_binding.py
          tests/test_alpaca_snapshots.py
          tests/test_paper_journal.py
          tests/test_alpaca_paper.py
          tests/test_paper_read_transport.py
          tests/test_alpaca_authentication.py
          tests/test_onecli_v2_preflight.py
          tests/test_onecli_v2_production.py
          tests/test_paper_worker.py
          tests/test_paper_observer_bootstrap.py
          tests/test_credential_proof.py
          tests/test_alpaca_provider.py
          tests/test_data_catalog.py
          tests/test_market_data_calendar.py
          tests/test_market_data_validation.py
      - name: Verify portable test report
        if: always()
        run: python tools/assert_junit_report.py portable-test-results.xml
      # actions/upload-artifact v7.0.1
      - name: Upload portable test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-test-results
          path: portable-test-results.xml
          if-no-files-found: error
          retention-days: 30
