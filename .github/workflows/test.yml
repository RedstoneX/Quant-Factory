name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test documentation validator
        run: python -m unittest tests.test_documentation_governance -v
      - name: Check current documentation and retained incident history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            python tools/check_documentation.py
          else
            python tools/check_documentation.py --base-ref "$BASE_REF"
          fi

  portable-tests:
    name: Portable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify change scope
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_REF" HEAD > "$RUNNER_TEMP/changed-files.txt"
          if grep -Ev '^(AGENTS\.md|README\.md|docs/|dashboard/assets/.*\.(css|svg|png|jpg|jpeg|webp|ico)$)' "$RUNNER_TEMP/changed-files.txt" | grep -q .; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Lightweight documentation/static-asset proof
        if: steps.scope.outputs.full == 'false'
        run: echo "The separate required Documentation contracts job supplies the applicable proof; no runtime test lane is justified."
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.scope.outputs.full == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-ci.txt
            requirements-dashboard.txt
      - name: Build and prove outbound socket guard
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          cc -shared -fPIC -O2 -Wall -Wextra -Werror \
            tools/block_outbound_connect.c -ldl \
            -o "$RUNNER_TEMP/qf-block-outbound.so"
          LD_PRELOAD="$RUNNER_TEMP/qf-block-outbound.so" \
            python tools/verify_socket_blocker.py
      - name: Enforce structural maintainability ratchets
        if: steps.scope.outputs.full == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_structural_maintainability.py --base-ref "$BASE_REF"
      - name: Enforce architecture dependency boundaries
        if: steps.scope.outputs.full == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_architecture.py --base-ref "$BASE_REF"
      - name: Install public test dependencies
        if: steps.scope.outputs.full == 'true'
        run: >-
          python -m pip install
          --constraint requirements-runtime.txt
          --requirement requirements-runtime.txt
          --requirement requirements-ci.txt
          --requirement requirements-dashboard.txt
      - name: Validate complete test-lane inventory
        if: steps.scope.outputs.full == 'true'
        run: >-
          python -m pytest --collect-only -q
          --write-test-lane-inventory=test-lane-inventory.json
          --ignore=tests/browser
          tests
      - name: Run every portable non-browser test
        if: steps.scope.outputs.full == 'true'
        env:
          LD_PRELOAD: ${{ runner.temp }}/qf-block-outbound.so
        run: >-
          python -m pytest -q
          -m "not licensed_vectorbt and not external_prefect and not controlled_market_data"
          --junitxml=portable-nonbrowser-test-results.xml
          --ignore=tests/browser
          tests
      - name: Verify exact portable non-browser coverage
        if: always() && steps.scope.outputs.full == 'true'
        run: >-
          python tools/assert_test_lane_report.py
          test-lane-inventory.json
          portable-nonbrowser-test-results.xml
          portable-nonbrowser
      # actions/upload-artifact v7.0.1
      - name: Upload non-browser test report
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-nonbrowser-test-results
          path: |
            portable-nonbrowser-test-results.xml
            test-lane-inventory.json
          if-no-files-found: error
          retention-days: 7
