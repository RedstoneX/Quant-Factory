# Standard bug-catching lint for CI. Fixed configuration: no per-file ignores,
# no baseline. Style rules are deliberately not selected.
target-version = "py312"
line-length = 120
extend-exclude = [".claude", "data", "docs"]

[lint]
select = [
    "F",      # pyflakes: undefined names, unused imports/variables, redefinitions
    "E9",     # syntax errors and I/O errors
    "B",      # flake8-bugbear: likely bugs and design problems
    "BLE001", # blind `except Exception`
]

# Rules in the selected families that the current code base violates. They are
# listed here (with the count on the day the config was written) so the CI step
# starts green on every rule it enforces; remove an entry once its violations
# are fixed. This is a fixed list, not a baseline: the ignored rule is not
# enforced anywhere until it is removed.
ignore = [
    "B905",   # zip-without-explicit-strict (58)
    "F401",   # unused-import (43)
    "F405",   # undefined-local-with-import-star-usage (35)
    "B009",   # get-attr-with-constant (20)
    "BLE001", # blind-except (14)
    "F821",   # undefined-name (10)
    "F841",   # unused-variable (4)
    "B033",   # duplicate-value (2)
    "F822",   # undefined-export (2)
    "B008",   # function-call-in-default-argument (1)
    "B028",   # no-explicit-stacklevel (1)
    "F403",   # undefined-local-with-import-star (1)
    "B007",   # unused-loop-control-variable (1)
]
