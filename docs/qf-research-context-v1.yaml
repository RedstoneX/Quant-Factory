schema: qf_research_context_v1
snapshot_date: '2026-10-01'
purpose: Portable context for external LLM/human strategy research before QF Candidate
  v1 intake.
authority:
  tier1:
  - AGENTS.md
  - docs/MILESTONES.md
  - docs/DECISIONS.md
  candidate_contract: docs/qf-candidate-v1.md
  data_catalog: docs/DATA_CATALOG.md
  notice: This file is a convenience snapshot. Quant Factory re-checks current Tier-1
    authority, prior work, data, and Candidate validity before research.
mandate:
  research_style: same_session_intraday
  holding_period: minutes_to_hours
  overnight_positions: false
  primary_behavior:
  - S&P 500
  - Nasdaq-100
  first_stage_instruments:
  - MES
  - MNQ
  later_transfer_targets:
  - SPY
  - QQQ
  - index products
  options_role: Options/0DTE are possible later execution vehicles, not the source
    of the trading edge.
  current_research_state: paused_until_owner_accepts_a_bounded_candidate
research_rules:
- Treat a symbol, wrapper, source repository, or parameter change as insufficient
  by itself to create a new hypothesis.
- Deduplicate against prior Quant Factory strategy families before proposing a Candidate.
- Separate structural strategy variants from bounded variables VectorBT may sweep.
- Do not invent missing source rules silently; preserve them as open_questions.
- Do not run backtests, optimize parameters, claim profitability, or implement QF
  strategy code unless separately authorized.
- Do not inspect protected evidence, buy data, submit orders, or infer paper/live
  authority.
- Candidate work must remain same-session intraday unless the owner explicitly changes
  the mandate.
prior_work:
- family: opening_range_breakout
  instrument: MES
  status: rejected
  disposition: do_not_repeat_without_genuinely_new_hypothesis
  reference: docs/strategies/mes-opening-range-breakout.md
- family: overnight_gap_reversal
  instrument: MES
  status: rejected
  disposition: do_not_rerun_or_tune
  reference: docs/strategies/mes-overnight-gap-reversal.md
- family: opening_range_breakout
  instrument: MSFT
  status: withdrawn
  disposition: historical_only
  reference: docs/strategies/msft-five-minute-orb-transfer.md
- family: intraday_momentum
  instrument: SPYM
  status: historical
  disposition: not_current_candidate
  reference: docs/strategies/spym-intraday-momentum.md
- family: donchian_trend_breakout
  instrument: SPY
  status: historical
  disposition: not_current_candidate
  reference: docs/strategies/spy-donchian-trend-breakout.md
- family: rsi_mean_reversion
  instrument: SPYM
  status: historical_fixture
  disposition: infrastructure_or_prior_work_not_new_edge
  reference: strategies/spym_rsi_mean_reversion_fixture.py
- family: turn_of_month
  instrument: SPY
  status: out_of_scope
  disposition: retain_for_possible_future_swing_research
  reason: multi-day holding conflicts with current intraday mandate
  reference: docs/strategies/spy-turn-of-month.md
