data_caveat: This snapshot describes catalogued datasets, not guaranteed runtime availability.
  Quant Factory must verify local manifests/checksums before use.
candidate_output_contract:
  schema: qf_candidate_v1
  required_core:
  - candidate.title
  - hypothesis.behavior
  - market.holding_style=intraday
  - market.overnight_positions=false
  - rules
  - sources or owner_observation attribution
  strongly_expected:
  - hypothesis.failure_theory
  - source_rules
  - qf_interpretation
  - fixed
  - variables
  - variants
  - open_questions
  - data_needs
  - exclusions
  - prior_work
  - evaluation.use_qf_standard_screen=true
  variable_rule: variables are justified bounded values VectorBT may enumerate; do
    not enumerate every combination yourself
  variant_rule: variants are genuinely different logic paths; do not disguise parameter
    changes or prior-work duplicates as new variants
  import_authority: External packets may be draft, needs_clarification, or ready_for_review
    only; they cannot assert owner approval or execution authority.
external_research_instruction: Use this context before researching. Survey the requested
  sources or strategy universe, deduplicate against prior_work, exclude mandate conflicts,
  and return QF Candidate v1 packets only for genuinely distinct hypotheses. Preserve
  uncertainties. Do not backtest, optimize, implement, or rank a winner unless the
  owner separately requests that work.
